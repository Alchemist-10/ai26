global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 5s

rule_files:
  - /etc/prometheus/ai26-alerts.yml

scrape_configs:
  - job_name: ai26
    metrics_path: /api/metrics
    static_configs:
      - targets: ["backend:8001"]
    authorization:
      type: Bearer
      credentials_file: /run/secrets/ai26-metrics-token
