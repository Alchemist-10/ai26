[project]
name = "ai26-backend"
version = "0.1.0"
description = "AI26 demo backend (YOLO + Fast-ALPR inference)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "ultralytics",
    "fast-alpr",
    "open-image-models==0.6.0",
    "fast-plate-ocr==1.1.0",
    "opencv-python",
    "python-multipart",
    "requests",
    "onnxruntime",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "pydantic",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["httpx2", "httpx"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
